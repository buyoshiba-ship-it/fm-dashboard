<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>nobuちゃん担当施設マスター [スマホ専用Web版]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg-primary:#0f1117; --bg-secondary:#1a1b23; --bg-card:#22232d; --bg-hover:#2a2b37;
  --text-primary:#f3f4f6; --text-secondary:#9ca3af; --text-muted:#6b7280;
  --border:#2d2e3a; --accent-blue:#60a5fa; --accent-purple:#a78bfa;
  --accent-green:#34d399; --accent-amber:#fbbf24; --accent-cyan:#22d3ee;
  --hp-color:#f472b6; --hp-bg:rgba(244,114,182,.15);
  --gp-color:#60a5fa; --gp-bg:rgba(96,165,250,.15);
  --dg-color:#34d399; --dg-bg:rgba(52,211,153,.15);
}
body { font-family:'Inter','Noto Sans JP',sans-serif; background:var(--bg-primary); color:var(--text-primary); min-height:100vh; overflow-x:hidden; }

#authContainer {
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
}
.lock-container {
  background:rgba(34,35,45,.9); border:1px solid rgba(255,255,255,.1);
  border-radius:24px; padding:36px 24px; text-align:center; width:100%; max-width:360px;
}
.lock-icon { font-size:48px; margin-bottom:12px; }
.lock-title { font-size:20px; font-weight:700; color:var(--accent-blue); margin-bottom:4px; }
.lock-subtitle { font-size:13px; color:var(--text-secondary); margin-bottom:24px; }
.pw-input {
  width:100%; padding:14px; background:#1a1b23; border:1px solid #2d2e3a; border-radius:12px;
  color:#fff; font-size:20px; font-family:inherit; text-align:center; letter-spacing:8px; outline:none; margin-bottom:16px;
}
.submit-btn {
  width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,#60a5fa,#a78bfa);
  color:white; font-size:16px; font-weight:700; cursor:pointer;
}
.error-msg { color:#fb7185; font-size:12px; margin-top:10px; display:none; }

#mainApp { display:none; min-height:100vh; padding-bottom:40px; }

.app-header {
  position:sticky; top:0; z-index:100; background:rgba(26,27,35,.95); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
}
.back-btn {
  background:rgba(255,255,255,.08); border:1px solid var(--border); color:var(--accent-blue);
  padding:6px 14px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; display:none;
}
.header-title { font-size:16px; font-weight:700; color:var(--text-primary); flex:1; text-align:center; }

.step-container { padding:16px; display:none; }
.step-container.active { display:block; }

/* Step 1: トップ選択画面 */
.mode-section-title { font-size:13px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin:16px 0 10px 4px; }

.big-nav-btn {
  width:100%; padding:16px 20px; background:linear-gradient(135deg,rgba(167,139,250,.15),rgba(96,165,250,.15));
  border:1px solid rgba(167,139,250,.3); border-radius:14px; color:var(--accent-purple);
  font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px; cursor:pointer;
}

.district-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
.district-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:12px;
  padding:16px 14px; text-align:center; cursor:pointer; transition:all .2s;
}
.district-card:active { background:var(--bg-hover); transform:scale(.98); }
.district-card-name { font-size:16px; font-weight:700; color:var(--text-primary); margin-bottom:4px; }
.district-card-count { font-size:12px; color:var(--accent-blue); font-weight:600; }

/* Step 2: 施設一覧画面 */
.filter-tabs { display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; padding-bottom:4px; }
.ftab {
  padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg-card);
  color:var(--text-secondary); font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer;
}
.ftab.active { background:rgba(96,165,250,.2); border-color:var(--accent-blue); color:var(--accent-blue); }

.facility-list { display:flex; flex-direction:column; gap:10px; }
.facility-card-btn {
  background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
  padding:16px; display:flex; align-items:center; justify-content:space-between; cursor:pointer;
}
.facility-card-btn:active { background:var(--bg-hover); }
.fac-btn-name { font-size:16px; font-weight:700; color:var(--text-primary); margin-bottom:4px; }
.fac-btn-sub { font-size:12px; color:var(--text-secondary); display:flex; gap:8px; align-items:center; }

.badge { padding:2px 6px; border-radius:4px; font-size:10px; font-weight:700; }
.badge-hp { background:var(--hp-bg); color:var(--hp-color); }
.badge-gp { background:var(--gp-bg); color:var(--gp-color); }
.badge-dg { background:var(--dg-bg); color:var(--dg-color); }

/* Step 3: 施設詳細画面 */
.detail-box { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; }
.detail-fac-title { font-size:22px; font-weight:700; color:var(--text-primary); margin-bottom:6px; }
.detail-fac-sub { font-size:13px; color:var(--text-secondary); margin-bottom:16px; display:flex; gap:8px; align-items:center; }

.share-section { margin-bottom:20px; }
.share-title { font-size:13px; font-weight:700; color:var(--text-muted); margin-bottom:10px; }
.share-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.share-card { background:var(--bg-secondary); border:1px solid var(--border); border-radius:10px; padding:10px 6px; text-align:center; }
.share-rank { font-size:10px; color:var(--accent-amber); font-weight:700; }
.share-name { font-size:12px; font-weight:700; color:var(--text-primary); margin:2px 0; }
.share-pct { font-size:16px; font-weight:700; color:var(--accent-cyan); }

.memo-box { background:rgba(251,191,36,.08); border:1px dashed rgba(251,191,36,.4); border-radius:12px; padding:14px; margin-bottom:20px; }
.memo-title { font-size:12px; font-weight:700; color:var(--accent-amber); margin-bottom:6px; }
.memo-text { font-size:13px; color:var(--text-primary); line-height:1.5; white-space:pre-wrap; }

.prod-list-title { font-size:13px; font-weight:700; color:var(--text-muted); margin-bottom:10px; }
.prod-vertical-list { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
.prod-card-item { background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; padding:12px; font-size:14px; font-weight:600; }

.giant-map-btn {
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:16px;
  background:linear-gradient(135deg,#60a5fa,#a78bfa); border:none; border-radius:14px;
  color:white; font-size:16px; font-weight:700; text-decoration:none; box-shadow:0 8px 20px rgba(96,165,250,.3);
}

/* 医薬品カタログモード */
.cat-search-box { position:sticky; top:60px; z-index:90; background:var(--bg-primary); padding:10px 0; margin-bottom:12px; }
.cat-input {
  width:100%; padding:12px 16px; background:var(--bg-secondary); border:1px solid var(--border);
  border-radius:10px; color:#fff; font-size:15px; font-family:inherit; outline:none;
}
.cat-list { display:flex; flex-direction:column; gap:8px; }
.cat-item {
  background:var(--bg-card); border:1px solid var(--border); border-radius:12px;
  padding:14px 16px; display:flex; align-items:center; justify-content:space-between; cursor:pointer;
}
.cat-item-name { font-size:15px; font-weight:700; color:var(--text-primary); }
.cat-item-count { padding:3px 8px; background:rgba(52,211,153,.15); border-radius:6px; color:var(--accent-green); font-size:12px; font-weight:700; }
</style>
</head>
<body>

<div id="authContainer">
  <div class="lock-container">
    <div class="lock-icon">🔐</div>
    <div class="lock-title">施設マスター [スマホ版]</div>
    <div class="lock-subtitle">パスワードを入力してください</div>
    <input type="password" class="pw-input" id="pwInput" placeholder="••••" autofocus inputmode="numeric" pattern="[0-9]*" />
    <button class="submit-btn" onclick="checkPassword()">ログイン</button>
    <div class="error-msg" id="errorMsg">パスワードが違います</div>
  </div>
</div>

<div id="mainApp">
  <header class="app-header">
    <button class="back-btn" id="backBtn" onclick="goBack()">← 戻る</button>
    <div class="header-title" id="headerTitle">エリア選択</div>
    <div style="width:50px"></div>
  </header>

  <!-- Step 1: トップ地域選択 -->
  <div class="step-container active" id="step1">
    <div class="big-nav-btn" onclick="openCatalogStep()">
      <span>💊 医薬品名から探す（全344品目）</span>
      <span>➔</span>
    </div>

    <div class="mode-section-title">📍 担当エリアを選択してください</div>
    <div class="district-grid" id="districtGrid"></div>
  </div>

  <!-- Step 2: 施設一覧画面 -->
  <div class="step-container" id="step2">
    <div class="filter-tabs">
      <div class="ftab active" onclick="filterType('all', event)">すべて</div>
      <div class="ftab" onclick="filterType('HP', event)">🏥 病院</div>
      <div class="ftab" onclick="filterType('GP', event)">🩺 クリニック</div>
      <div class="ftab" onclick="filterType('DG', event)">💊 薬局</div>
    </div>
    <div class="facility-list" id="facilityList"></div>
  </div>

  <!-- Step 3: 施設詳細画面 -->
  <div class="step-container" id="step3">
    <div id="detailContent"></div>
  </div>

  <!-- Step 4: 医薬品カタログ画面 -->
  <div class="step-container" id="step4">
    <div class="cat-search-box">
      <input type="text" class="cat-input" id="catInput" placeholder="薬名で検索（例：エソメプラゾール）..." oninput="updateCatList(this.value)" />
    </div>
    <div class="cat-list" id="catList"></div>
  </div>
</div>

    document.getElementById('backBtn').style.display = 'block';
  } else {
    document.getElementById('backBtn').style.display = 'none';
  }
  
  if(historyStack[historyStack.length - 1] !== stepId) {
    historyStack.push(stepId);
  }
  window.scrollTo(0,0);
}

function goBack() {
  if(historyStack.length > 1) {
    historyStack.pop();
    const prevStep = historyStack[historyStack.length - 1];
    let title = 'エリア選択';
    if(prevStep === 'step2') title = selectedDistrict.replace('新潟県','') + 'の施設';
    else if(prevStep === 'step4') title = '医薬品カタログ';
    navTo(prevStep, title);
  }
}

function selectDistrict(dist) {
  selectedDistrict = dist;
  selectedProduct = null;
  currentTypeFilter = 'all';
  const label = dist === 'all' ? '全エリア' : dist.replace('新潟県','');
  
  currentDistrictFacilities = DATA.filter(d => dist === 'all' || d['行政地区'] === dist);
  currentDistrictFacilities.sort((a,b) => b['製品数'] - a['製品数']);
  
  renderFacilityList();
  navTo('step2', label + 'の施設');
}

function filterType(t, evt) {
  currentTypeFilter = t;
  document.querySelectorAll('.ftab').forEach(tab => tab.classList.remove('active'));
  if(evt && evt.target) evt.target.classList.add('active');
  renderFacilityList();
}

function getBadge(t) { return t==='HP'?'badge-hp':t==='GP'?'badge-gp':t==='DG'?'badge-dg':'badge-other'; }

function renderFacilityList() {
  const listArea = document.getElementById('facilityList');
  let list = currentDistrictFacilities;
  
  if(currentTypeFilter !== 'all') {
    list = list.filter(d => d['施設区分'] === currentTypeFilter);
  }
  if(selectedProduct) {
    list = list.filter(d => (d['製品リスト']||[]).some(p => p.toLowerCase().includes(selectedProduct.toLowerCase())));
  }

  let html = '';
  list.forEach((fac) => {
    const dIdx = findDataIndex(fac);
    html += `<div class="facility-card-btn" onclick="openDetail(${dIdx})">
      <div>
        <div class="fac-btn-name">${fac['施設名']}</div>
        <div class="fac-btn-sub">
          <span class="badge ${getBadge(fac['施設区分'])}">${fac['施設区分']||'?'}</span>
          <span>📍 ${fac['行政地区'].replace('新潟県','')}</span>
          <span>💊 品目:${fac['製品数']}</span>
        </div>
      </div>
      <div style="font-size:18px;color:var(--text-muted)">➔</div>
    </div>`;
  });

  listArea.innerHTML = html || '<div style="text-align:center;padding:30px;color:var(--text-muted)">該当する施設がありません</div>';
}

function findDataIndex(targetFac) {
  return DATA.findIndex(d => d['DCF'] === targetFac['DCF']);
}

function openDetail(dataIndex) {
  const fac = DATA[dataIndex];
  const panel = document.getElementById('detailContent');

  let html = `<div class="detail-box">
    <div class="detail-fac-title">${fac['施設名']}</div>
    <div class="detail-fac-sub">
      <span class="badge ${getBadge(fac['施設区分'])}">${fac['施設区分']||'?'}</span>
      <span>📍 ${fac['行政地区']}</span>
      <span>担当: <strong>${fac['担当者']||'松本'}</strong></span>
    </div>`;

  const shares = fac['卸シェア'] || [];
  if(shares.length > 0) {
    const ranks = ['🥇 1位', '🥈 2位', '🥉 3位'];
    let shareCards = '';
    shares.forEach((s, i) => {
      shareCards += `<div class="share-card">
        <div class="share-rank">${ranks[i]||''}</div>
        <div class="share-name">${s.name}</div>
        <div class="share-pct">${s.pct}%</div>
      </div>`;
    });
    html += `<div class="share-section">
      <div class="share-title">📊 卸構成シェア ベスト3</div>
      <div class="share-grid">${shareCards}</div>
    </div>`;
  }

  if(fac['面会ルールメモ']) {
    html += `<div class="memo-box">
      <div class="memo-title">💡 訪問・面会ルール ＆ 現場ノウハウメモ</div>
      <div class="memo-text">${fac['面会ルールメモ']}</div>
    </div>`;
  }

  const prods = fac['製品リスト'] || [];
  let prodItems = '';
  prods.forEach(p => {
    prodItems += `<div class="prod-card-item">💊 ${p}</div>`;
  });

  html += `<div class="prod-list-title">💊 採用品目リスト（全${prods.length}品目）</div>
    <div class="prod-vertical-list">${prodItems}</div>
    
    <a class="giant-map-btn" href="https://www.google.com/maps/search/${encodeURIComponent(fac['行政地区'] + ' ' + fac['施設名'])}" target="_blank">
      📍 Googleマップアプリで場所を開く
    </a>
  </div>`;

  panel.innerHTML = html;
  navTo('step3', fac['施設名']);
}

function openCatalogStep() {
  updateCatList('');
  navTo('step4', '医薬品カタログ（全344品目）');
}

function updateCatList(qText) {
  const listArea = document.getElementById('catList');
  const q = qText.toLowerCase().trim();
  const items = q ? CATALOG.filter(c => c.name.toLowerCase().includes(q)) : CATALOG;

  let html = '';
  items.forEach(c => {
    const safeName = c.name.replace(/'/g, "\'");
    html += `<div class="cat-item" onclick="selectProductFromCat('${safeName}')">
      <div class="cat-item-name">💊 ${c.name}</div>
      <div class="cat-item-count">${c.fac_count} 施設で採用</div>
    </div>`;
  });

  listArea.innerHTML = html;
}

function selectProductFromCat(prodName) {
  selectedProduct = prodName;
  currentDistrictFacilities = DATA.filter(d => (d['製品リスト']||[]).some(p => p.toLowerCase().includes(prodName.toLowerCase())));
  currentDistrictFacilities.sort((a,b) => b['製品数'] - a['製品数']);
  renderFacilityList();
  navTo('step2', '🎯 ' + prodName + ' 採用施設');
}
</script>
</body>
</html>
