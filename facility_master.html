<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nobuちゃん担当施設マスター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg-primary:#0f1117; --bg-secondary:#1a1b23; --bg-card:#22232d; --bg-hover:#2a2b37;
  --text-primary:#e8e9ed; --text-secondary:#9ca3af; --text-muted:#6b7280;
  --border:#2d2e3a; --accent-blue:#60a5fa; --accent-purple:#a78bfa;
  --accent-green:#34d399; --accent-amber:#fbbf24; --accent-cyan:#22d3ee;
  --hp-color:#f472b6; --hp-bg:rgba(244,114,182,.12);
  --gp-color:#60a5fa; --gp-bg:rgba(96,165,250,.12);
  --dg-color:#34d399; --dg-bg:rgba(52,211,153,.12);
  --other-color:#fbbf24; --other-bg:rgba(251,191,36,.12);
  --glass-border:rgba(255,255,255,.06);
}
body { font-family:'Inter','Noto Sans JP',sans-serif; background:var(--bg-primary); color:var(--text-primary); min-height:100vh; }

/* 認証画面 */
#authContainer {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
}
.lock-container {
  background:rgba(34,35,45,.8); border:1px solid rgba(255,255,255,.06);
  border-radius:24px; padding:48px 40px; text-align:center;
  max-width:380px; width:90%; backdrop-filter:blur(20px);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.lock-icon { font-size:48px; margin-bottom:16px; }
.lock-title {
  font-size:20px; font-weight:700; margin-bottom:6px;
  background:linear-gradient(135deg,#60a5fa,#a78bfa);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.lock-subtitle { font-size:13px; color:#9ca3af; margin-bottom:28px; }
.pw-input {
  width:100%; padding:14px 18px; background:#1a1b23;
  border:1px solid #2d2e3a; border-radius:12px;
  color:#e8e9ed; font-size:16px; font-family:inherit;
  text-align:center; letter-spacing:4px;
  outline:none; transition:all .3s; margin-bottom:16px;
  -webkit-appearance:none;
}
.pw-input:focus { border-color:#60a5fa; box-shadow:0 0 0 3px rgba(96,165,250,.15); }
.pw-input.error { border-color:#fb7185; box-shadow:0 0 0 3px rgba(251,113,133,.15); animation:shake .4s; }
.submit-btn {
  width:100%; padding:14px; border:none; border-radius:12px;
  background:linear-gradient(135deg,#60a5fa,#a78bfa);
  color:white; font-size:15px; font-weight:600;
  font-family:inherit; cursor:pointer;
  transition:all .3s; opacity:.9;
}
.submit-btn:hover { opacity:1; transform:translateY(-1px); }
.error-msg { color:#fb7185; font-size:12px; margin-top:12px; display:none; }
.error-msg.show { display:block; }
@keyframes shake {
  0%,100% { transform:translateX(0); }
  25% { transform:translateX(-8px); }
  50% { transform:translateX(8px); }
  75% { transform:translateX(-4px); }
}

/* メインコンテンツ（非表示） */
#mainApp { display:none; }

.container { max-width:1440px; margin:0 auto; padding:20px 16px; }
.header {
  text-align:center; margin-bottom:24px; padding:32px 20px;
  background:linear-gradient(135deg,rgba(96,165,250,.08),rgba(167,139,250,.08));
  border:1px solid var(--glass-border); border-radius:20px;
}
.header h1 {
  font-size:26px; font-weight:700;
  background:linear-gradient(135deg,var(--accent-blue),var(--accent-purple));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:4px;
}
.header p { color:var(--text-secondary); font-size:13px; }

.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:16px; }
.stat-card {
  background:var(--bg-card); border:1px solid var(--border); border-radius:12px;
  padding:14px 12px; text-align:center; transition:all .3s;
}
.stat-card:hover { transform:translateY(-2px); border-color:var(--accent-blue); }
.stat-card .number { font-size:24px; font-weight:700; margin-bottom:2px; }
.stat-card .label { font-size:11px; color:var(--text-secondary); font-weight:500; }

.filter-section {
  background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
  padding:16px; margin-bottom:12px; position:relative;
}
.filter-section.product-section { z-index:50; }
.filter-section h3 {
  font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:10px;
  text-transform:uppercase; letter-spacing:.06em;
  display:flex; align-items:center; gap:6px;
}

.search-box { position:relative; margin-bottom:12px; }
.search-box input {
  width:100%; padding:10px 14px 10px 38px;
  background:var(--bg-primary); border:1px solid var(--border); border-radius:10px;
  color:var(--text-primary); font-size:14px; font-family:inherit; outline:none;
  transition:all .3s;
}
.search-box input:focus { border-color:var(--accent-blue); box-shadow:0 0 0 3px rgba(96,165,250,.1); }
.search-box::before { content:'🔍'; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; }

.district-buttons { display:flex; flex-wrap:wrap; gap:6px; }
.district-btn {
  padding:7px 14px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg-primary); color:var(--text-secondary); font-size:12px;
  font-family:inherit; cursor:pointer; transition:all .2s; font-weight:500;
  white-space:nowrap;
}
.district-btn:hover { border-color:var(--accent-blue); color:var(--text-primary); }
.district-btn.active {
  background:rgba(96,165,250,.15); border-color:var(--accent-blue); color:var(--accent-blue);
}
.district-btn .district-count { font-size:10px; opacity:.6; margin-left:3px; }

.type-buttons { display:flex; gap:6px; flex-wrap:wrap; }
.type-btn {
  padding:7px 14px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg-primary); color:var(--text-secondary); font-size:12px;
  font-family:inherit; cursor:pointer; transition:all .2s; font-weight:500;
}
.type-btn:hover { border-color:var(--accent-blue); color:var(--text-primary); }
.type-btn.active { background:rgba(96,165,250,.15); border-color:var(--accent-blue); color:var(--accent-blue); }
.type-btn.hp.active { background:var(--hp-bg); border-color:var(--hp-color); color:var(--hp-color); }
.type-btn.gp.active { background:var(--gp-bg); border-color:var(--gp-color); color:var(--gp-color); }
.type-btn.dg.active { background:var(--dg-bg); border-color:var(--dg-color); color:var(--dg-color); }
.type-btn.other.active { background:var(--other-bg); border-color:var(--other-color); color:var(--other-color); }

.product-filter-row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; }
.product-filter-left { flex:1; min-width:280px; }
.product-filter-left input {
  width:100%; padding:10px 14px;
  background:var(--bg-primary); border:1px solid var(--border); border-radius:10px;
  color:var(--text-primary); font-size:13px; font-family:inherit; outline:none;
  transition:all .3s; margin-bottom:8px;
}
.product-filter-left input:focus { border-color:var(--accent-purple); box-shadow:0 0 0 3px rgba(167,139,250,.1); }

.product-list {
  background:var(--bg-primary); border:1px solid var(--border); border-radius:10px;
  max-height:200px; overflow-y:auto; display:none;
}
.product-list.show { display:block; }
.product-list-item {
  padding:10px 14px; cursor:pointer; font-size:13px;
  border-bottom:1px solid rgba(45,46,58,.4); transition:background .15s;
  -webkit-tap-highlight-color:rgba(167,139,250,.2);
}
.product-list-item:active { background:rgba(167,139,250,.15); }
.product-list-item:hover { background:var(--bg-hover); }
.product-list-item:last-child { border-bottom:none; }
.product-list-item.selected { background:rgba(167,139,250,.1); color:var(--accent-purple); font-weight:600; }
.product-list-count { padding:8px 14px; font-size:11px; color:var(--text-muted); border-bottom:1px solid var(--border); }
.product-toggle-btn {
  padding:8px 16px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg-primary); color:var(--text-secondary); font-size:12px;
  font-family:inherit; cursor:pointer; transition:all .2s; width:100%;
}
.product-toggle-btn:hover { border-color:var(--accent-purple); color:var(--text-primary); }

.mode-toggle { display:flex; border-radius:10px; overflow:hidden; border:1px solid var(--border); }
.mode-btn {
  padding:9px 18px; border:none; cursor:pointer;
  font-size:12px; font-weight:600; font-family:inherit;
  transition:all .2s; background:var(--bg-primary); color:var(--text-muted);
}
.mode-btn:first-child { border-right:1px solid var(--border); }
.mode-btn.active-yes { background:rgba(52,211,153,.15); color:var(--accent-green); }
.mode-btn.active-no { background:rgba(251,191,36,.15); color:var(--accent-amber); }

.selected-product-tag {
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 14px; margin-top:10px;
  background:rgba(167,139,250,.12); border:1px solid rgba(167,139,250,.3);
  border-radius:8px; font-size:13px; color:var(--accent-purple); font-weight:500;
}
.clear-btn { cursor:pointer; font-size:16px; line-height:1; opacity:.6; transition:opacity .2s; }
.clear-btn:hover { opacity:1; }

.sort-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

select {
  padding:7px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg-primary); color:var(--text-primary); font-size:12px;
  font-family:inherit; cursor:pointer; outline:none;
}
select:focus { border-color:var(--accent-blue); }

.result-count { font-size:13px; color:var(--text-muted); padding:6px 0; }

.active-filter-info {
  display:none; padding:10px 16px; margin-bottom:10px;
  background:rgba(167,139,250,.06); border:1px solid rgba(167,139,250,.15);
  border-radius:10px; font-size:13px; color:var(--accent-purple);
}
.active-filter-info.show { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

.table-container { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
table { width:100%; border-collapse:collapse; }
thead th {
  padding:11px 12px; text-align:left; font-size:11px; font-weight:600;
  color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em;
  border-bottom:1px solid var(--border); background:var(--bg-secondary);
  white-space:nowrap;
}
tbody tr { border-bottom:1px solid var(--border); transition:background .2s; }
tbody tr:hover { background:var(--bg-hover); }
tbody tr:last-child { border-bottom:none; }
tbody td { padding:10px 12px; font-size:13px; vertical-align:top; }

.badge { display:inline-block; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:600; }
.badge-hp { background:var(--hp-bg); color:var(--hp-color); }
.badge-gp { background:var(--gp-bg); color:var(--gp-color); }
.badge-dg { background:var(--dg-bg); color:var(--dg-color); }
.badge-other { background:var(--other-bg); color:var(--other-color); }

.facility-name { font-weight:500; cursor:pointer; color:var(--text-primary); transition:color .2s; }
.facility-name:hover { color:var(--accent-blue); }
.map-btn {
  display:inline-flex; align-items:center; gap:4px;
  padding:5px 12px; margin-top:8px;
  background:rgba(96,165,250,.1); border:1px solid rgba(96,165,250,.25);
  border-radius:6px; color:var(--accent-blue); font-size:11px; font-weight:500;
  text-decoration:none; transition:all .2s; cursor:pointer;
}
.map-btn:hover { background:rgba(96,165,250,.2); border-color:var(--accent-blue); }
.district { color:var(--text-secondary); font-size:12px; }
.qty { font-weight:600; font-variant-numeric:tabular-nums; color:var(--accent-cyan); }
.wholesalers { font-size:11px; color:var(--text-muted); max-width:200px; }
.product-match { color:var(--accent-green); font-weight:600; font-size:12px; }
.product-nomatch { color:var(--accent-amber); font-weight:600; font-size:12px; }

.mini-chart { display:flex; align-items:flex-end; gap:2px; height:26px; }
.mini-bar {
  width:5px; min-height:2px; background:var(--accent-blue);
  border-radius:2px 2px 0 0; opacity:.7; transition:opacity .2s;
}
.mini-bar:hover { opacity:1; }

.expand-btn {
  background:none; border:none; color:var(--text-muted);
  cursor:pointer; font-size:13px; transition:transform .3s; padding:3px;
}
.expand-btn.expanded { transform:rotate(90deg); }
.detail-row { display:none; }
.detail-row td { padding:0 12px 14px 46px; background:rgba(96,165,250,.02); }
.detail-row.show { display:table-row; }
.detail-content { display:flex; flex-wrap:wrap; gap:4px; }
.detail-section { margin-bottom:8px; }
.detail-section h4 { font-size:10px; color:var(--text-muted); margin-bottom:4px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
.product-tag {
  display:inline-block; padding:2px 7px;
  background:rgba(96,165,250,.08); border:1px solid rgba(96,165,250,.15);
  border-radius:4px; font-size:10px; color:var(--text-secondary);
}
.product-tag.highlight {
  background:rgba(167,139,250,.15); border-color:rgba(167,139,250,.4);
  color:var(--accent-purple); font-weight:600;
}

@media (max-width:768px) {
  .product-filter-row,.sort-row { flex-direction:column; }
  .product-filter-left { min-width:100%; }
  .stats-grid { grid-template-columns:repeat(2,1fr); }
  .header h1 { font-size:20px; }
  .table-container { overflow-x:auto; }
}
</style>
</head>
<body>

<!-- 認証画面 -->
<div id="authContainer">
  <div class="lock-container">
    <div class="lock-icon">🔐</div>
    <div class="lock-title">施設マスター</div>
    <div class="lock-subtitle">パスワードを入力してください</div>
    <input type="password" class="pw-input" id="pwInput" placeholder="••••" autofocus inputmode="numeric" pattern="[0-9]*" />
    <button class="submit-btn" id="submitBtn" onclick="checkPassword()">ログイン</button>
    <div class="error-msg" id="errorMsg">パスワードが違います</div>
  </div>
</div>

<!-- メインアプリケーション -->
<div id="mainApp">
  <div class="container">
    <header class="header">
      <h1>📋 担当施設マスター</h1>
      <p>PTRS1 ｜ 2025/4〜2026/7 ｜ 長岡〜上越エリア ｜ 686施設 ｜ 344製品</p>
    </header>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="施設名・地区名で検索..." />
    </div>

    <div class="filter-section">
      <h3>📍 地区</h3>
      <div class="district-buttons" id="districtButtons"></div>
    </div>

    <div class="filter-section">
      <h3>🏥 施設区分</h3>
      <div class="type-buttons" id="typeButtons">
        <button class="type-btn active" data-type="all">すべて</button>
        <button class="type-btn hp" data-type="HP">🏥 病院</button>
        <button class="type-btn gp" data-type="GP">🩺 クリニック</button>
        <button class="type-btn dg" data-type="DG">💊 薬局</button>
        <button class="type-btn other" data-type="other">📦 その他</button>
      </div>
    </div>

    <div class="filter-section product-section">
      <h3>💊 製品フィルター</h3>
      <div class="product-filter-row">
        <div class="product-filter-left">
          <input type="text" id="productInput" placeholder="製品名で絞り込み（例：エソメプラゾール）..." />
          <button class="product-toggle-btn" id="productToggleBtn" onclick="toggleProductList()">▼ 製品リストを開く（344品目）</button>
          <div class="product-list" id="productList"></div>
        </div>
        <div class="mode-toggle">
          <button class="mode-btn active-yes" id="modeYes" onclick="setMode('yes')">✅ 採用あり</button>
          <button class="mode-btn" id="modeNo" onclick="setMode('no')">❌ 未採用</button>
        </div>
      </div>
      <div id="selectedProductArea"></div>
    </div>

    <div class="filter-section">
      <div class="sort-row">
        <select id="sortSelect">
          <option value="qty-desc">合計数量 多い順</option>
          <option value="qty-asc">合計数量 少ない順</option>
          <option value="name-asc">施設名 あいうえお順</option>
          <option value="products-desc">製品数 多い順</option>
        </select>
      </div>
    </div>

    <div class="active-filter-info" id="activeFilterInfo"></div>
    <div class="result-count" id="resultCount"></div>

    <div class="table-container">
      <table>
        <thead><tr>
          <th style="width:26px"></th>
          <th>区分</th>
          <th>施設名</th>
          <th>地区</th>
          <th id="productStatusHeader">製品数</th>
          <th>合計数量</th>
          <th>推移</th>
          <th>主要卸</th>
        </tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

async function sha256(text) {
  const encoder = new TextEncoder();
  const data = encoder.encode(text);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function initApp() {
  if(appInitialized) return;
  appInitialized = true;

  const districtCounts = {};
  DATA.forEach(d => { districtCounts[d['行政地区']] = (districtCounts[d['行政地区']]||0)+1; });

  const dContainer = document.getElementById('districtButtons');
  let html = `<button class="district-btn active" data-district="all">すべて<span class="district-count">${DATA.length}</span></button>`;
  DISTRICT_ORDER.forEach(d => {
    const label = d.replace('新潟県','');
    const count = districtCounts[d]||0;
    html += `<button class="district-btn" data-district="${d}">${label}<span class="district-count">${count}</span></button>`;
  });
  dContainer.innerHTML = html;
  dContainer.querySelectorAll('.district-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      dContainer.querySelectorAll('.district-btn').forEach(b => b.classList.remove('active'));

    let sc;
    if(selectedProduct) {
      sc=hasProduct(d,selectedProduct)?'<span class="product-match">✅ 採用</span>':'<span class="product-nomatch">— 未採用</span>';
    } else { sc=`<span>${d['製品数']}</span>`; }
    html+=`<tr class="data-row" data-idx="${i}">
      <td><button class="expand-btn" onclick="toggleDetail(${i})">▶</button></td>
      <td>${badge}</td>
      <td><span class="facility-name" onclick="toggleDetail(${i})">${d['施設名']}</span></td>
      <td><span class="district">${d['行政地区'].replace('新潟県','')}</span></td>
      <td>${sc}</td>
      <td class="qty">${d['合計数量'].toLocaleString()}</td>
      <td>${miniChart(d['月別合計数量'])}</td>
      <td class="wholesalers">${ws}</td>
    </tr>`;
    const prods=(d['製品リスト']||[]).map(p=>{
      const hl=selectedProduct&&p.includes(selectedProduct);
      return `<span class="product-tag ${hl?'highlight':''}">${p}</span>`;
    }).join('');
    const grps=(d['商品群リスト']||[]).filter(g=>g).map(g=>`<span class="product-tag">${g}</span>`).join('');
    html+=`<tr class="detail-row" id="detail-${i}"><td colspan="8">
      <div class="detail-section"><h4>商品群</h4><div class="detail-content">${grps}</div></div>
      <div class="detail-section"><h4>取扱製品（${d['製品数']}品目）</h4><div class="detail-content">${prods}</div></div>
      <div class="detail-section"><a class="map-btn" href="${mapUrl(d['施設名'])}" target="_blank">📍 Googleマップで開く</a></div>
    </td></tr>`;
  });
  tbody.innerHTML=html;
  document.getElementById('resultCount').textContent=`${data.length} 件表示`;
  const info=document.getElementById('activeFilterInfo');
  if(selectedProduct) {
    info.innerHTML=`🎯 <strong>${selectedProduct}</strong> が <strong>${productMode==='yes'?'✅ 採用あり':'❌ 未採用'}</strong> の施設を表示中`;
    info.classList.add('show');
  } else { info.classList.remove('show'); }
}

function toggleDetail(i) {
  document.getElementById(`detail-${i}`).classList.toggle('show');
  document.querySelector(`tr[data-idx="${i}"] .expand-btn`).classList.toggle('expanded');
}

function applyFilters() {
  let f=DATA.filter(d=>{
    if(currentType!=='all') {
      if(currentType==='other') { if(['HP','GP','DG'].includes(d['施設区分'])) return false; }
      else { if(d['施設区分']!==currentType) return false; }
    }
    if(currentDistrict!=='all'&&d['行政地区']!==currentDistrict) return false;
    if(currentSearch) {
      const q=currentSearch.toLowerCase();
      if(!(d['施設名']||'').toLowerCase().includes(q)&&!(d['行政地区']||'').toLowerCase().includes(q)
        &&!(d['製品リスト']||[]).join(' ').toLowerCase().includes(q)) return false;
    }
    if(selectedProduct) {
      const has=hasProduct(d,selectedProduct);
      if(productMode==='yes'&&!has) return false;
      if(productMode==='no'&&has) return false;
    }
    return true;
  });
  if(currentSort==='qty-desc') f.sort((a,b)=>b['合計数量']-a['合計数量']);
  else if(currentSort==='qty-asc') f.sort((a,b)=>a['合計数量']-b['合計数量']);
  else if(currentSort==='name-asc') f.sort((a,b)=>a['施設名'].localeCompare(b['施設名'],'ja'));
  else if(currentSort==='products-desc') f.sort((a,b)=>b['製品数']-a['製品数']);
  renderStats(f); renderTable(f);
}

const productList=document.getElementById('productList');
const productToggleBtn=document.getElementById('productToggleBtn');
let productListOpen=false;

function renderProductList(filter) {
  const q=(filter||'').toLowerCase();
  const items=q?ALL_PRODUCTS.filter(p=>p.toLowerCase().includes(q)):ALL_PRODUCTS;
  let html=`<div class="product-list-count">${items.length} / ${ALL_PRODUCTS.length} 品目</div>`;
  html+=items.map(p=>{
    const sel=selectedProduct===p?'selected':'';
    return `<div class="product-list-item ${sel}" data-name="${p.replace(/"/g,'&quot;')}">${p}</div>`;
  }).join('');
  productList.innerHTML=html;
  productList.querySelectorAll('.product-list-item').forEach(el=>{
    el.addEventListener('click',function(e) {
      e.preventDefault(); e.stopPropagation();
      selectProduct(this.dataset.name);
    });
    el.addEventListener('touchend',function(e) {
      e.preventDefault(); e.stopPropagation();
      selectProduct(this.dataset.name);
    });
  });
  if(q && items.length>0 && !productListOpen) {
    productList.classList.add('show');
    productToggleBtn.textContent='▲ 製品リストを閉じる';
    productListOpen=true;
  }
  if(q && items.length===0) {
    productList.innerHTML='<div class="product-list-count">該当する製品がありません</div>';
    productList.classList.add('show');
  }
}

function toggleProductList() {
  productListOpen=!productListOpen;
  if(productListOpen) {
    productList.classList.add('show');
    productToggleBtn.textContent='▲ 製品リストを閉じる';
    renderProductList(document.getElementById('productInput').value);
  } else {
    productList.classList.remove('show');
    productToggleBtn.textContent=`▼ 製品リストを開く（${ALL_PRODUCTS.length}品目）`;
  }
}

function selectProduct(name) {
  selectedProduct=name;
  productListOpen=false;
  productList.classList.remove('show');
  productToggleBtn.textContent=`▼ 製品リストを開く（${ALL_PRODUCTS.length}品目）`;
  document.getElementById('productInput').value='';
  renderSelectedProduct();
  applyFilters();
}

function clearProduct() {
  selectedProduct=null;
  renderSelectedProduct();
  applyFilters();
}

function renderSelectedProduct() {
  const area=document.getElementById('selectedProductArea');
  area.innerHTML=selectedProduct
    ?`<span class="selected-product-tag">💊 ${selectedProduct} <span class="clear-btn" onclick="clearProduct()">✕</span></span>`
    :'';
}

function setMode(m) {
  productMode=m;
  document.getElementById('modeYes').className='mode-btn'+(m==='yes'?' active-yes':'');
  document.getElementById('modeNo').className='mode-btn'+(m==='no'?' active-no':'');
  applyFilters();
}
</script>
</body>
</html>
